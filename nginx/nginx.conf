# One-file nginx config for the platform on :80.
# /api/*   -> backend  (FastAPI, port 6500)
# /*       -> frontend (Next.js, port 3000)
#
# SSE streams are the sensitive bit: /api/projects/{id}/publish and
# /api/chat use `text/event-stream`. Turn buffering off, disable
# gzip, keep the connection idle-timer high enough for a 5-min build.

events { worker_connections 1024; }

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    gzip off;             # SSE hates any transformation
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Large SSE frames + long tool outputs shouldn't tempt nginx to buffer.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # Use Docker's embedded DNS at container start. Without a `resolver`,
    # nginx tries to resolve `backend` / `frontend` at startup, and if
    # those containers aren't up yet (compose can start them in any
    # order despite depends_on), nginx crashes with "host not found".
    # Deferring resolution via variables + a resolver dodges that race.
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 80 default_server;
        server_name _;
        client_max_body_size 25m;

        location /api/ {
            set $backend_upstream backend:6500;
            proxy_pass http://$backend_upstream;
        }

        # Next.js dev-mode websocket (used only if we ever run `next dev`
        # here; harmless in prod).
        location /_next/webpack-hmr {
            set $frontend_upstream frontend:3000;
            proxy_pass http://$frontend_upstream;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location / {
            set $frontend_upstream frontend:3000;
            proxy_pass http://$frontend_upstream;
        }
    }
}
