services:
  paddleocr:
    build: .
    image: forge-paddleocr:latest
    container_name: forge-paddleocr
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
