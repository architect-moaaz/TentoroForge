name: CI

# Every branch, every pull request. It used to run only on `main`, which had
# not moved since August, so none of the smithv2–v5 work was ever checked
# (audit, 2026-11-01). Each job is a gate: nothing here continues on error.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — gate and fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The interpreter the suite is run with locally; the image runs 3.12.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install
        working-directory: backend
        run: pip install -r requirements-dev.txt

      # Code that cannot run: syntax errors and names that do not exist. Each
      # of these was a crash waiting on a path (an unterminated prompt, a
      # Smith turn's lost queue, a ledger that was never passed).
      - name: Lint (syntax errors, undefined names)
        working-directory: backend
        run: ruff check --isolated --select E9,F63,F7,F82 --target-version py311 --exclude node_modules,output .

      - name: Every module imports
        working-directory: backend
        env:
          DATABASE_URL: sqlite+aiosqlite://
          SECRET_KEY: ci-secret
        run: python -c "import main"

      # The fast tier: the routes (who may reach what), the platform's
      # security rules, and what generated apps are given. The whole suite
      # is hours; this is minutes, and it is the part a regression is most
      # dangerous in.
      - name: Fast tests
        working-directory: backend
        run: python -m pytest -q -p no:randomly -p no:cacheprovider $(cat tests/fast.txt)

  frontend:
    name: Frontend — types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # The workspace packages the editor and the tests import are built
      # first: a test that imports `@forge/registry` with no dist cannot load.
      - name: Install and build the packages
        run: |
          npm ci
          npm run build

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit -p .

      - name: Tests
        working-directory: frontend
        run: npx vitest run
