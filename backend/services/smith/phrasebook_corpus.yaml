  # -- The sentences that reach nothing ------------------------------------
  #
  # No `reaches`. Each one is a claim that nothing in the code takes it, and
  # the claim is re-tested on every run: a verb, a command or a gate that
  # starts taking one of these turns its colour and fails the test.

  - id: gap-nightly-backup
    say: "Can you back this up every night?"
    checked: {colour: nothing, via: none}
    source: phrasebook
    gap: Keeping it safe
    because: >-
      `export_data` hands over every record as a zip when it is asked, which is
      a backup — and nothing repeats it, so "every night" reaches nothing

  - id: gap-where-are-backups
    say: "Where are the backups kept?"
    checked: {colour: nothing, via: none}
    source: phrasebook
    gap: Keeping it safe
    because: >-
      a copy is handed to them, never kept, so there is nowhere to point at

  - id: gap-logo-upload
    say: "Can I put my logo at the top?"
    checked: {colour: nothing, via: none}
    source: phrasebook
    gap: Pictures and branding
    because: >-
      `restyle` decides colours, type and density from words — there is no way
      to give it a file

  - id: gap-photo-per-record
    say: "I want to upload a photo for each nurse"
    checked: {colour: nothing, via: none}
    source: phrasebook
    gap: Pictures and branding
    because: >-
      a field can be added to a record, and nothing puts an image into one

  - id: gap-pdf-invoice
    say: "Can it produce a PDF invoice?"
    checked: {colour: nothing, via: none}
    source: phrasebook
    gap: Paper out the other end
    because: >-
      the workflow node catalogue has nothing that renders a document, so this
      cannot be authored as a process either
