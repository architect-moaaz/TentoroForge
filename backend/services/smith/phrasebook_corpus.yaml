  # -- From the routing corpus ---------------------------------------------
  #
  # `backend/tests/routing/corpus.jsonl` collects the same owner sentences for
  # the OTHER HALF of the question: it labels each with the verb the model
  # should pick, and `run_corpus.py` calls a model once per sentence to measure
  # whether it does. That is stage one. This file is stage two — what the code
  # then does with the verb, which is where a slot the sentence never stated
  # turns an edit into a question.
  #
  # The two are not the same claim and neither derives from the other: "get rid
  # of the export link" routes to `remove` AND is answered with "which screen?".
  # So the sentences live in both, and `test_phrasebook.py` asserts that a
  # sentence in both carries the same verb in both.
