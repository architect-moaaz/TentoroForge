# The owner's phrasebook — the sentences, and nothing that moves.
#
# Each entry is one sentence a business owner would type, kept VERBATIM. The
# sentence is the evidence; reworded into product language it stops being
# evidence of anything. What colour Smith gives it is never DECIDED here — it
# is computed by `services.smith.phrasebook` against the code as it stands
# today, because the colour is exactly the part that goes stale, and written
# back as `checked` only so the next run can contradict it. The phrasebook's
# closing list once said "Put it back how it was — no undo and no restore
# point" while `services/smith/revert.py` was shipped and `VERB_HELP` quoted
# "put it back" as an example of asking for it.
#
# PER SENTENCE, ONLY WHAT IS TRUE OF THE SENTENCE:
#
#   say        the words, verbatim.
#   checked    the colour the code gave the sentence when this file was last
#              written, and how. Recorded ONLY so it can be contradicted:
#              nothing reads it to decide anything, and
#              `tests/services/test_phrasebook.py` fails when the code's answer
#              and this disagree — in either direction. A sentence newly
#              answered and a verb that quietly stopped answering one both show
#              up here as a one-line diff.
#   source     `code` when the sentence is quoted in the code as an example of
#              asking for something (`verbs.VERB_HELP` or the understanding
#              prompt) — those are owner-voice by construction and they are
#              what the chips offer; `phrasebook` when it comes from the
#              document.
#   reaches    what the sentence is asking for, as one of:
#                verb:    a verb in `verbs.REQUIRED_BY_VERB`
#                command: a lifecycle word in `_LIFECYCLE_VERBS`
#                gate:    a consent gate in the router
#              omitted entirely when the sentence reaches nothing.
#   states     the slots the SENTENCE ITSELF supplies. Not what the verb needs
#              — that is read from the verb table on every run, and a slot
#              added to a verb turns every sentence that does not state it from
#              "Smith acts" into "Smith asks", which is the drift this catches.
#   gap        for a sentence that reaches nothing: what it is an instance of.
#   because    for a sentence that reaches nothing: why, in one clause.
#
# THERE IS NO PLACE HERE FOR AN EXCEPTION. If a sentence cannot be coloured
# without one, that is a finding about the verb set — `phrasebook.findings()`
# reports those — not a case to hide in this file.
#
# This is a seed. The document's full set pastes in under `sentences:` with the
# keys above, `checked` left out and filled in by
# `python -m services.smith.phrasebook --rewrite-checked`. Every sentence the
# code itself quotes is already here, which is what makes the stale-claim
# check bite.

version: 1

# THE VERB SET'S OWN DEFECTS, WRITTEN DOWN RATHER THAN EXEMPTED.
#
# `phrasebook.findings()` and `phrasebook.contract_gaps()` read the verb table,
# the understanding prompt, the capability groups and the dispatcher, and
# report what does not line up. Each one below is open today. The test asserts
# this list EXACTLY: a new one fails it, and so does fixing one without
# striking it here — which is how a fix gets noticed rather than absorbed.
open_findings:

  # `rebuild` is recognised, answered with a reason and changes nothing — the
  # dispatcher tells the person to press "Approve and build" — but it is not in
  # `limits.cannot`, so `capabilities.GROUPS` files it under "The whole
  # application · Regenerate it from its definition", which is a thing the chat
  # cannot do. Either the answer moves into `limits`, or the group stops
  # advertising it.
  - about: verb refused outside the refusal table
    verbs: [rebuild]

  # `define` and `approve` are in `_LIFECYCLE_VERBS`, which is what stops a
  # bare command being read as an edit — and no branch in the router answers
  # either of them and no consent gate takes them. Typed on their own they
  # reach the architect as a sentence to reason about. `build` is in the same
  # list and is fine: `_is_build_consent` takes it.
  - about: command declared and answered nowhere
    verbs: [approve, define]

  # `REQUIRED_BY_VERB["rename"]` demands `screen`, `current_behavior` and
  # `desired_behavior`; an understanding has no such fields, and the prompt
  # asks for `new_value`, which the table does not list. The gate is skipped
  # for `rename` rather than never passing — see `slot_gate_skips`.
  - about: required slot the understanding cannot carry
    verbs: [rename]

